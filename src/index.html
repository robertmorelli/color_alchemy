<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Alchemy</title>
</head>

<body>
  <form id="state"></form>

  <div id="game-viewport">
    <div id="layer-book">
      <div id="book-panel">
        <div id="book-close"></div>
        <div id="book-viewer"></div>
      </div>
    </div>
    <div id="layer-map">
      <div id="map-panel">
        <div id="map-close"></div>
        <div id="map-viewer"></div>
      </div>
    </div>
    <div id="layer-flasks">
      <div class="flask" id="black"></div>
      <div class="flask" id="white"></div>
      <div class="flask" id="cyan"></div>
      <div class="flask" id="blue"></div>
      <div class="flask" id="orange"></div>
      <div class="flask" id="yellow"></div>
      <div class="flask" id="crimson"></div>
      <div class="flask" id="red"></div>
    </div>
    <div id="layer-tutorial">
      <div id="tutorial-textbox"></div>
      <div id="tutorial-arrow"></div>
      <div id="tutorial-next"></div>
      <div id="tutorial-prev"></div>
      <div id="tutorial-skip"></div>
    </div>
    <div id="layer-cauldron">
      <div id="cauldron-bubbles"></div>
      <div id="cauldron-window"></div>
      <div id="cauldron-image"></div>
      <div id="cauldron-pie"></div>

    </div>
    <div id="layer-base">
      <div id="goals">
        <div id="goals-text"></div>
        <div class="goal-lightbulb"></div>
        <div class="goal-lightbulb"></div>
        <div class="goal-lightbulb"></div>
        <div class="goal-lightbulb"></div>
        <div id="goals-scroll"></div>
        <div class="goal-color"></div>
        <div class="goal-color"></div>
        <div class="goal-color"></div>
        <div class="goal-color"></div>
      </div>
      <div id="shelves">
        <div id="shelves-left"></div>
        <div id="shelves-right"></div>
      </div>
      <div id="instructions">
        <div id="instructions-text"> </div>
        <div id="instructions-image"></div>
        <div id="instructions-book"></div>
      </div>
      <div id="dump">
        <div id="dump-image"></div>
        <div id="dump-text"> </div>
      </div>
      <div id="stage-skip"></div>
      <div id="ground">
        <div class="goto-stage"></div>
        <div class="goto-stage"></div>
        <div class="goto-stage"></div>
        <div id="title"></div>
      </div>
    </div>
  </div>
</body>

</html>
